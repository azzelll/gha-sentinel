on:
  pull_request_target:
    types: [closed]
permissions: { contents: write }
jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - run: npm ci && npm run release
